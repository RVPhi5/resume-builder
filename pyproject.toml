[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-tailor"
version = "0.1.0"
description = "Generate job-tailored one-page resumes from a structured master resume, compiled with pdflatex."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "pymupdf>=1.24",
    "click>=8.1",
    "anthropic>=0.40",
]

[project.scripts]
resume-tailor = "resume_tailor.cli:main"

[tool.setuptools.packages.find]
include = ["resume_tailor*"]
